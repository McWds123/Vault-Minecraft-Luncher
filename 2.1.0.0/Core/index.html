<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>启动器</title>
    <style>
        /* --------------------------
        全局重置：删除所有默认样式！
        这行解决你看到的边框、active、奇怪动画
        ---------------------------*/
        * {
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
            box-sizing: border-box;
            -webkit-appearance: none;
            appearance: none;
        }
        body {
            background: #2C3E50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .RunGameButton {
            position: fixed;       
            right: 20px;     
            bottom: 20px;
            width: 300px;
            height: 100px;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.7s ease;
        }
        .RunGameButton:hover {
            transform: rotate(360deg) scale(1.05);
            background: linear-gradient(45deg, #ff6b6b, #f38181);
        }
        .RunGameButton:active {
            transform: scale(0.95);
        }

        .ChoiceVersionButton {
            position: fixed;
            right: 20px;
            bottom: 130px;
            width: 300px;
            height: 50px;
            border-radius: 12px;
            border: #fad0c4;
            background: #2C3E50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 0 15px;
            cursor: pointer;
        }
        .ChoiceVersionButton:hover {
            background: linear-gradient(45deg, #ff6b6b, #f38181);
            border:#ff9a9e;
        }
        #mySelect {
            position: fixed;
            right: 20px;
            bottom: 130px;
            width: 300px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 0 15px;
            cursor: pointer;
            border: 0;
        }
        #mySelect:hover {
            background: linear-gradient(45deg, #ff6b6b, #f38181);
            color: gray;
        }
    </style>
</head>

<body onload="window.external.ChoiceVersion()">
<button class="RunGameButton" onclick="window.external.RunGameButton()">启动游戏</button>
<label>
    <select id="mySelect" class="ChoiceVersionButton">
        <option value="">请选择版本</option>
    </select>
</label>
</body>
</html>
